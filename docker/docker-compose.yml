# ---------------------------------------------------------------------------
# FuturesRL full stack
#
#   cp docker/.env.example docker/.env
#   docker compose -f docker/docker-compose.yml up --build
#
#   frontend → http://localhost:3100   (Next.js workstation)
#   backend  → http://localhost:8000   (FastAPI REST + WebSocket)
#   gateway  → 127.0.0.1:4003 (paper API, VNC 5900) — opt-in profile "ibkr"
#
# Storage is local-first: partitioned Parquet + Polars/DuckDB inside the
# backend_data volume. There is no external database or cache service.
# Without IBKR/Databento credentials the backend serves deterministic offline
# fixtures, so the stack starts and remains usable out of the box.
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Optional headless IB Gateway (paper). Only starts with:
  #   docker compose --profile ibkr up
  # Requires TWS_USERID / TWS_PASSWORD in docker/.env.
  # Container ports: 4003 = paper gateway API, 5900 = noVNC.
  # -------------------------------------------------------------------------
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    profiles: ["ibkr"]
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${IB_GATEWAY_TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      BYPASS_WARNING: "yes"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "05:00"
      TWS_SETTINGS_PATH: /home/ibgateway/Jts
      TIME_ZONE: America/New_York
      TRUSTED_IPS: ${IB_GATEWAY_TRUSTED_IPS:-}
    ports:
      - "127.0.0.1:${IB_GATEWAY_PORT:-4003}:${IB_GATEWAY_INTERNAL_PORT:-4003}"
      - "127.0.0.1:${IB_GATEWAY_VNC_PORT:-5900}:5900"
    volumes:
      - ib_gateway_data:/home/ibgateway/Jts
    networks:
      - futuresrl
    logging: *default-logging

  # -------------------------------------------------------------------------
  # FastAPI backend: REST + /ws/telemetry. Local Parquet/DuckDB storage lives
  # in backend_data; artifacts (tear sheets, studies, models) in
  # backend_artifacts. Runs offline when IBKR/Databento are unavailable.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: futuresrl/backend:1.0.0
    restart: unless-stopped
    environment:
      FUTURESRL_ENVIRONMENT: ${FUTURESRL_ENVIRONMENT:-paper}
      FUTURESRL_LOG_LEVEL: ${FUTURESRL_LOG_LEVEL:-INFO}
      FUTURESRL_API_HOST: 0.0.0.0
      FUTURESRL_API_PORT: "8000"
      FUTURESRL_API_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3100}","http://127.0.0.1:${FRONTEND_PORT:-3100}"]'
      FUTURESRL_TELEMETRY_INTERVAL_SECONDS: "1.0"
      # IBKR (when the optional ib-gateway profile is running)
      FUTURESRL_IBKR_HOST: ${FUTURESRL_IBKR_HOST:-ib-gateway}
      FUTURESRL_IBKR_PORT: ${FUTURESRL_IBKR_PORT:-4003}
      FUTURESRL_IBKR_CLIENT_ID: ${FUTURESRL_IBKR_CLIENT_ID:-42}
      FUTURESRL_IBKR_PAPER: "true"
      FUTURESRL_API_ENABLE_IBKR: ${FUTURESRL_API_ENABLE_IBKR:-0}
      FUTURESRL_DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
      # Local-first storage (Parquet + DuckDB)
      FUTURESRL_DATA_DIR: /app/data
      FUTURESRL_DUCKDB_PATH: /app/data/futuresrl.duckdb
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
      - backend_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - futuresrl
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Next.js workstation. NEXT_PUBLIC_API_BASE_URL is build-time.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    image: futuresrl/frontend:1.0.0
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - futuresrl
    logging: *default-logging

networks:
  futuresrl:
    name: futuresrl_net
    driver: bridge

volumes:
  ib_gateway_data:
    name: futuresrl_ib_gateway_data
  backend_data:
    name: futuresrl_backend_data
  backend_artifacts:
    name: futuresrl_backend_artifacts
