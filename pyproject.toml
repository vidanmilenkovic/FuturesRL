[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futuresrl-x"
version = "1.7.0"
description = "FuturesRL-X: modular, production-grade algorithmic futures trading platform (FinRL-X weight-centric pipeline, futures-native backtesting, IBKR paper/live execution)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FuturesRL-X Team" }]
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "scipy>=1.13",
    # Hyperparameter search backend for the Strategy Studio optimizer (optional at
    # runtime: src/backtest/optimizer.py has a deterministic offline fallback).
    "optuna>=3.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Historical market-data ingestion (Databento SDK is optional at runtime: adapters
# degrade to a deterministic offline source when the SDK/credentials are absent).
databento = ["databento>=0.40"]
# IBKR live/paper connectivity.
live = ["ib_async>=1.0"]
# Deep-reinforcement-learning allocators (heavy: pulls in torch).
drl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
futuresrl-backtest = "src.backtest.engine:main"
futuresrl-api = "src.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "frontend/node_modules", "frontend/.next"]
src = ["src", "configs", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter for code, docstrings may wrap
    "B008",  # Typer/Depends-style defaults in FastAPI signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B011"]
"src/api/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# Prose documentation (Markdown) is hand-authored for readability; the Python
# formatter must not reflow code fences inside guides/READMEs.
exclude = ["*.md", "docs/**"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "."
files = ["src", "configs"]
show_error_codes = true
pretty = true
exclude = ["^frontend/", "^data/"]

[[tool.mypy.overrides]]
module = [
    "databento.*",
    "ib_async.*",
    "stable_baselines3.*",
    "torch.*",
    "gymnasium.*",
    "uvicorn.*",
    "websockets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises multiple modules together",
    "slow: long-running (still offline and deterministic)",
    "network: would require live/paid APIs (never enabled in unit CI)",
    "parity: cross-engine deployment-parity tests (backtest vs live execution)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Upstream starlette TestClient emits a deprecation warning about httpx on
    # import; it is not actionable for this project (no httpx2 dependency cycle).
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/api/*", "*/__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
