id: esnq_trend_following
description: Trend Following (TSMOM + KAMA) preset
tags:
- trend
- classical
- tsmom
- vol-target
universe:
  name: regime
  params:
    trend_lookback_days: 126
    vol_lookback_days: 60
    shock_lookback_days: 3
    shock_z_threshold: 3
    shock_return_threshold: 0.02
    macro_vol_threshold: 0.22
    breadth_threshold: 0.6
    filter_negative_trend: true
    min_universe: 1
    top_n: 10
    require_both: false
    risk_off_roots: ''
    risk_off_sectors: ''
    roots: ES,NQ
allocator:
  name: volatility_target
  params:
    target_annual_volatility: 0.12
    covariance_lookback_days: 60
    max_gross_leverage: 3
    min_gross_leverage: 0
    max_weight: 0.5
    ridge: 1.0e-10
    shrinkage: 0
    min_volatility: 0.002
timing:
- name: tsmom
  params:
    lookback_fast: 21
    lookback_slow: 126
    vol_lookback: 20
- name: kama
  params:
    window: 10
    fast_period: 2
    slow_period: 30
risk:
- name: quant_risk
  params:
    vol_target: 0.12
    ewma_halflife_days: 20
    max_single_instrument_weight: 0.5
    max_sector_weight: 0.4
    drawdown_limit_pct: 0.2
    daily_max_loss_pct: 0.03
    trailing_stop_pct: 0.1
- name: llm_risk
  params:
    confidence_threshold: 0.7
    safe_score: 1.5
    critical_score: 4.5
    risk_penalty_lambda: 0.5
translator:
  rounding_mode: nearest
  rebalance_buffer_contracts: 2.0
  max_margin_utilization: 0.6
  enable_micro_routing: true
  min_micro_notional_ratio: 0.0
backtest: null
drl: null
