version: 1
# ---------------------------------------------------------------------------
# FuturesRL-X instrument master
#
# Every futures root traded by the platform is declared here with its CME/IBKR
# metadata: contract multiplier, tick size, roll methodology, margin estimator
# and the standard <-> micro routing pair used by the ContractTranslator.
#
# Margins are conservative CME SPAN / IBKR initial & maintenance *estimates*.
# They are configuration, not truth: the live Pre-Trade Risk Gate always
# confirms the real margin requirement with IBKR `whatIfOrder` before transmit.
# ---------------------------------------------------------------------------

defaults:
  currency: USD
  price_precision: 2
  rounding_mode: nearest
  rebalance_buffer_contracts: 2
  max_margin_utilization: 0.60
  max_order_contracts: 200

instruments:
  ES:
    name: E-mini S&P 500
    asset_class: equity_index
    sector: equity
    exchange: CME
    multiplier: 50.0
    tick_size: 0.25
    databento_symbol: ES.FUT
    ibkr_exchange: CME
    micro_root: MES
    margins:
      initial: 15000.0
      maintenance: 13600.0
    roll:
      trigger: calendar_days_before_fnd
      days_before_fnd: 5
      use_volume_crossover: true
      contract_months: [3, 6, 9, 12]
      physical_delivery: false

  MES:
