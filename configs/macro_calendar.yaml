# macro-event lockout windows (Risk-First circuit breaker).
#
# Consumed by:
#   from src.risk.llm_risk_overlay import MacroEventCalendar
#   calendar = MacroEventCalendar.from_json(Path("configs/macro_calendar.yaml"))
#
# Timestamps are UTC (the parser rejects naive timestamps on purpose).
# `tier: 1` events trigger the configured `macro_lockout_minutes_before/after`
# flatten-or-cap window; tier 2/3 events are informational context for the LLM.
#
# This is an editable research template, not an authoritative exchange
# calendar: refresh from the official BLS / BEA / Federal Reserve / EIA / USDA
# release schedules before live use. Recurring patterns (CPI mid-month 12:30Z,
# NFP first Friday 12:30Z, EIA Wednesdays 14:30Z, FOMC 18:00Z) are encoded so a
# single edit per quarter keeps the windows meaningful.
# ---------------------------------------------------------------------------
